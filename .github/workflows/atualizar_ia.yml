name: Atualizar Base do Agente BI

on:
  schedule:
    # A cada 2 horas em horário comercial. Horários em UTC: 11,13,...,21 = 08h,10h,...,18h em Brasília
    - cron: '0 11,13,15,17,19,21 * * 1-5'
  workflow_dispatch: # Permite clicar em "Run workflow" manualmente a qualquer hora

permissions:
  contents: write

# Evita duas execuções ao mesmo tempo (ex.: agendada + manual) brigando pelo push
concurrency:
  group: atualizar-ia
  cancel-in-progress: false

jobs:
  atualizar-json:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Se os dados estiverem inconsistentes o script falha aqui e NADA é publicado
      - name: Gerar dados_ia.json a partir do Google Sheets
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python gerar_dados_ia.py

      - name: Commitar e publicar no GitHub Pages
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dados_ia.json
          if git diff --staged --quiet; then
            echo "Sem mudanças em dados_ia.json"
          else
            git commit -m "chore: atualiza dados_ia.json"
            # se alguém commitou (ex.: editou o index.html) durante a execução, integra antes do push
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
